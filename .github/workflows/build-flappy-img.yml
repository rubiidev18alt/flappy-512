name: Build Flappy-512 boot image

on:
  workflow_dispatch:
  push:
    paths:
      - "flappy.asm"
      - ".github/workflows/build-flappy-img.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - name: Assemble boot sector
        run: |
          nasm -f bin flappy.asm -o flappy.img
          test "$(wc -c < flappy.img)" -eq 512
          python3 - <<'PY'
          from pathlib import Path
          image = Path("flappy.img").read_bytes()
          assert len(image) == 512, f"expected 512 bytes, got {len(image)}"
          assert image[510:512] == b"\x55\xaa", f"bad boot signature: {image[510:512].hex()}"
          print("Valid 512-byte boot sector with 0xAA55 signature")
          PY
      - name: Upload raw image
        uses: actions/upload-artifact@v4
        with:
          name: flappy-img
          path: flappy.img
          if-no-files-found: error
